# 用固定的 aura 提交（AURA_PIN）的官方产物（aura#4907：运行时镜像 ghcr.io/cybrid-systems/aura:<sha>，
# 自包含 bundle）跑每个 kit 并和 golden 结果比较。不再从源码编译；镜像不存在时 fetch-aura.sh 才退回源码构建。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # 每天跑一次，及时发现 aura 行为漂移

jobs:
  kits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch aura @ AURA_PIN (official runtime image)
        run: scripts/fetch-aura.sh

      - name: evolve-strategy (golden, 20 steps)
        run: scripts/check-golden.sh evolve-strategy

      - name: evolve-strategy report (60 steps)
        run: |
          KIT_OUT=$PWD/report AURA_EVO_LOG=$PWD/report/evo.jsonl scripts/run-kit.sh evolve-strategy
          .aura-bin/aura evo report --html report/html --run last --log report/evo.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: evolve-strategy-report
          path: report/

      # 同一程序在各种执行方式下应得到同一结果（aura "单一公开语义"，aura#4908）。
      # 阻塞：任何不一致都让 CI 变红。此 job 没有 continue-on-error。
      # 2026-11-06 在官方镜像 ghcr.io/cybrid-systems/aura:7002d30ab（含 #4928，
      # 尚无 #4937 的后续提交）上，evolve-strategy 6 步 15 格 diffs=0，
      # 包括原先豁免的 unset-force-soa-direct、unset-force-soa-load、
      # soft-force-soa-direct。不再设置 MATRIX_KNOWN_RED。
      - name: Mode matrix
        env:
          AURA_BIN: ${{ github.workspace }}/.aura-bin/aura
          KIT_STEPS: "6"
          KIT_TIMEOUT: "120"
          MATRIX_OUT: ${{ github.workspace }}/matrix
        run: scripts/mode-matrix.sh evolve-strategy

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mode-matrix-logs
          path: matrix/
          if-no-files-found: ignore
